<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7FAFC"/><text x="72" y="44" fill="#13A89E" font-size="18" font-weight="bold" text-anchor="start"><tspan x="72">07 / 容错设计</tspan></text><text x="1208" y="44" fill="#607789" font-size="18" font-weight="normal" text-anchor="end"><tspan x="1208">08</tspan></text><text x="72" y="112" fill="#12344D" font-size="42" font-weight="bold" text-anchor="start"><tspan x="72">失败时保留人工与本机路径</tspan></text><line x1="72" y1="148" x2="1208" y2="148" stroke="#D5E1E8" stroke-width="1"/><use data-icon="tabler-outline/shield-check" x="88" y="201" width="34" height="34" fill="#13A89E" stroke-width="2"/><text x="140" y="228" fill="#12344D" font-size="24" font-weight="bold" text-anchor="start"><tspan x="140">模型输出校验</tspan></text><text x="140" y="274" fill="#18232C" font-size="18" font-weight="normal" text-anchor="start"><tspan x="140">结构与原文引用逐项检查。</tspan><tspan x="140" dy="30">深读不合格最多重试两次，</tspan><tspan x="140" dy="30">仍失败就明确报错。</tspan></text><line x1="88" y1="374" x2="588" y2="374" stroke="#D5E1E8" stroke-width="1"/><use data-icon="tabler-outline/alert-triangle" x="666" y="201" width="34" height="34" fill="#F2B451" stroke-width="2"/><text x="718" y="228" fill="#12344D" font-size="24" font-weight="bold" text-anchor="start"><tspan x="718">信息缺失</tspan></text><text x="718" y="274" fill="#18232C" font-size="18" font-weight="normal" text-anchor="start"><tspan x="718">原文没有时间就保留空缺。</tspan><tspan x="718" dy="30">用户可查看原文、手动修改，</tspan><tspan x="718" dy="30">再决定是否保存。</tspan></text><line x1="666" y1="374" x2="1166" y2="374" stroke="#D5E1E8" stroke-width="1"/><use data-icon="tabler-outline/checklist" x="88" y="413" width="34" height="34" fill="#13A89E" stroke-width="2"/><text x="140" y="440" fill="#12344D" font-size="24" font-weight="bold" text-anchor="start"><tspan x="140">离线任务</tspan></text><text x="140" y="486" fill="#18232C" font-size="18" font-weight="normal" text-anchor="start"><tspan x="140">已保存任务留在本机。</tspan><tspan x="140" dy="30">无网络时仍可查看和编辑，</tspan><tspan x="140" dy="30">AI服务不可用会单独提示。</tspan></text><line x1="88" y1="586" x2="588" y2="586" stroke="#D5E1E8" stroke-width="1"/><use data-icon="tabler-outline/file-text" x="666" y="413" width="34" height="34" fill="#13A89E" stroke-width="2"/><text x="718" y="440" fill="#12344D" font-size="24" font-weight="bold" text-anchor="start"><tspan x="718">文档边界</tspan></text><text x="718" y="486" fill="#18232C" font-size="18" font-weight="normal" text-anchor="start"><tspan x="718">单文件不超过20 MB。</tspan><tspan x="718" dy="30">PDF最多80页；扫描OCR</tspan><tspan x="718" dy="30">单次最多10页，效果受清晰度影响。</tspan></text><line x1="666" y1="586" x2="1166" y2="586" stroke="#D5E1E8" stroke-width="1"/><text x="88" y="638" fill="#607789" font-size="18" font-weight="normal" text-anchor="start"><tspan x="88">优先保留原文、错误提示和人工核对入口，不伪造完整答案。</tspan></text><line x1="72" y1="667" x2="1208" y2="667" stroke="#D5E1E8" stroke-width="1"/><text x="72" y="697" fill="#607789" font-size="18" font-weight="normal" text-anchor="start"><tspan x="72">知行 · 智能移动应用开发项目实践</tspan></text><text x="1208" y="697" fill="#607789" font-size="18" font-weight="normal" text-anchor="end"><tspan x="1208">08 / 11</tspan></text></svg>
