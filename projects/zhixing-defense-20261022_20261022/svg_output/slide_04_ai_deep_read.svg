<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif"><rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F7FAFC"/><text x="72" y="44" fill="#13A89E" font-size="18" font-weight="bold" text-anchor="start"><tspan x="72">03 / AI能力</tspan></text><text x="1208" y="44" fill="#607789" font-size="18" font-weight="normal" text-anchor="end"><tspan x="1208">04</tspan></text><text x="72" y="112" fill="#12344D" font-size="42" font-weight="bold" text-anchor="start"><tspan x="72">AI深读补足办理顺序与理由</tspan></text><line x1="72" y1="148" x2="1208" y2="148" stroke="#D5E1E8" stroke-width="1"/><text x="88" y="192" fill="#13A89E" font-size="18" font-weight="bold" text-anchor="start"><tspan x="88">可见输出</tspan></text><use data-icon="tabler-outline/sparkles" x="90" y="219" width="32" height="32" fill="#13A89E" stroke-width="2"/><text x="142" y="245" fill="#12344D" font-size="24" font-weight="bold" text-anchor="start"><tspan x="142">一句话概括</tspan></text><text x="142" y="279" fill="#607789" font-size="18" font-weight="normal" text-anchor="start"><tspan x="142">把通知主题压缩成可读结论。</tspan></text><use data-icon="tabler-outline/checklist" x="90" y="311" width="32" height="32" fill="#13A89E" stroke-width="2"/><text x="142" y="337" fill="#12344D" font-size="24" font-weight="bold" text-anchor="start"><tspan x="142">有序办理建议</tspan></text><text x="142" y="371" fill="#607789" font-size="18" font-weight="normal" text-anchor="start"><tspan x="142">把可执行步骤按先后关系排开。</tspan></text><use data-icon="tabler-outline/quote" x="90" y="403" width="32" height="32" fill="#13A89E" stroke-width="2"/><text x="142" y="429" fill="#12344D" font-size="24" font-weight="bold" text-anchor="start"><tspan x="142">理由与原文摘句</tspan></text><text x="142" y="463" fill="#607789" font-size="18" font-weight="normal" text-anchor="start"><tspan x="142">每项建议都能回到通知核对。</tspan></text><use data-icon="tabler-outline/message-question" x="90" y="495" width="32" height="32" fill="#13A89E" stroke-width="2"/><text x="142" y="521" fill="#12344D" font-size="24" font-weight="bold" text-anchor="start"><tspan x="142">待追问问题</tspan></text><text x="142" y="555" fill="#607789" font-size="18" font-weight="normal" text-anchor="start"><tspan x="142">暴露原文没有说明的关键信息。</tspan></text><line x1="88" y1="594" x2="930" y2="594" stroke="#D5E1E8" stroke-width="1"/><text x="88" y="626" fill="#F2B451" font-size="18" font-weight="bold" text-anchor="start"><tspan x="88">这是可审阅的建议，不是学校的正式解释。</tspan></text><rect x="1060" y="155" width="116" height="496" rx="5" fill="#FFFFFF" stroke="#D5E1E8" stroke-width="1"/><image href="../images/deep-read-mobile.png" x="1062" y="157" width="112" height="492" preserveAspectRatio="xMidYMid meet"/><line x1="72" y1="667" x2="1208" y2="667" stroke="#D5E1E8" stroke-width="1"/><text x="72" y="697" fill="#607789" font-size="18" font-weight="normal" text-anchor="start"><tspan x="72">知行 · 智能移动应用开发项目实践</tspan></text><text x="1208" y="697" fill="#607789" font-size="18" font-weight="normal" text-anchor="end"><tspan x="1208">04 / 11</tspan></text></svg>
